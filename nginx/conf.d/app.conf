# Reverse proxy + TLS termination for the kt-xnk frontend.
# Replace hd6089xzez8.sn.mynetname.net with the real hostname everywhere
# below — see docs/deployment.md for how to get one via MikroTik's free
# Cloud DDNS if you don't have a domain yet.

server {
    listen 80;
    server_name hd6089xzez8.sn.mynetname.net;

    # Let's Encrypt HTTP-01 challenge files.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else: redirect to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hd6089xzez8.sn.mynetname.net;

    ssl_certificate     /etc/letsencrypt/live/hd6089xzez8.sn.mynetname.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hd6089xzez8.sn.mynetname.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Same as the API's nginx: backup uploads (/admin/backups) reach the API
    # through this app's /api/backend proxy (API limit Backup:MaxUploadSizeMb 500).
    client_max_body_size 550m;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }
}
