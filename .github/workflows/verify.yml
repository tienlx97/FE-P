name: Frontend CI
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ./harness/audit-harness.sh
      - run: ./harness/verify.sh
      - name: Build clean checkout image
        run: docker build -t kt-xnk-ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-verification
          path: harness/runs/
          retention-days: 14
